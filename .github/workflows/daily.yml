name: daily ledger

# Record the paper portfolio after each US close. Self-gating rules (monthly switch, quarterly check, January
# selection) fire inside src/daily.py. This workflow only produces `data:` commits and never touches rule files.
on:
  schedule:
    # Plain UTC (no timezone key). GitHub drops scheduled runs under load, most often at :00 and :30, and
    # no :30 slot fired on 2026-11-13. So three runs on odd minutes, all after the close. Every run is
    # idempotent: a recorded day makes no commit. A local watchdog dispatches the run if all three are dropped.
    - cron: "17 22 * * 1-5"   # 17:17 / 18:17 New York
    - cron: "43 23 * * 1-5"   # 18:43 / 19:43 New York
    - cron: "11 13 * * 2-6"   # next morning 08:11 / 09:11 New York, catches a late Yahoo daily bar
  workflow_dispatch:

# Runs never overlap: a second run waits and then sees the day already recorded.
concurrency:
  group: daily-ledger
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install deps
        run: pip install --quiet pandas pyyaml yfinance

      # The rules are frozen: a config.yaml that does not match FROZEN.sha256 stops the day.
      - name: frozen rules check
        run: python -m tests.check_frozen

      - name: rule invariants (offline)
        run: python -m tests.test_rules

      - name: update ledger
        run: python -m src.daily

      - name: render charts
        run: python -m src.render

      - name: build P&L dashboard
        run: python -m src.dashboard

      - name: commit data
        run: |
          git config user.name  "Klay"
          git config user.email "klaywang24@gmail.com"
          git add data/ledger/ output/ || true
          if git diff --staged --quiet; then
            echo "no change"; exit 0
          fi
          git commit -m "data: daily ledger $(tail -1 data/ledger/nav.csv | cut -d, -f1)"
          for delay in 5 15; do
            if git push; then exit 0; fi
            sleep "$delay"; git pull --rebase
          done
          git push

      - name: anchor to Wayback
        continue-on-error: true
        run: |
          REPO="${GITHUB_REPOSITORY}"
          for u in \
            "https://github.com/${REPO}" \
            "https://github.com/${REPO}/blob/main/METHODOLOGY.md" \
            "https://github.com/${REPO}/blob/main/data/ledger/nav.csv" \
            "https://github.com/${REPO}/commits/main"
          do
            curl -sS -m 60 "https://web.archive.org/save/$u" -o /dev/null || true
            sleep 5
          done
